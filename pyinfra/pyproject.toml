[project]
name = "homelab"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["pyinfra>=3.9"]

[dependency-groups]
dev = ["ruff", "ty"]

[tool.ruff]
line-length = 100
preview = true
output-format = "grouped"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # ruff rule conflicts: ruff resolves these pairs itself but warns on every run
  "incorrect-blank-line-before-class", # conflicts with no-blank-line-before-class
  "multi-line-summary-second-line", # conflicts with multi-line-summary-first-line
  # ruff format conflicts
  "missing-trailing-comma",
  "single-line-implicit-string-concatenation",
  # not relevant
  "D1", # missing docstrings: not required for these infra scripts
  "CPY", # missing-copyright-notice: no copyright headers here
  "implicit-namespace-package", # pyinfra project, not a package
  "docstring-missing-returns", # docstrings here are optional one-liners,
  "docstring-missing-exception", # don't force Returns/Raises/Yields sections
  "docstring-missing-yields",
]

[tool.ruff.lint.flake8-type-checking]
# pyinfra evaluates @operation annotations at runtime during apply
runtime-evaluated-decorators = ["pyinfra.api.operation"]

[tool.ruff.lint.per-file-ignores]
# pyinfra FactBase requires command/process to be instance methods
"*/operations/*" = ["no-self-use"]

[tool.ty.rules]
all = "error"
